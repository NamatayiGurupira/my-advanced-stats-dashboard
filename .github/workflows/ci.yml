name: Quality Checks

# Run on every pull request and on pushes to main
# This is your "self-protecting" repository in action!
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Minimal permissions — this workflow only reads repository content
permissions:
  contents: read

jobs:
  lint-and-quality:
    name: Lint & Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install ruff nbstripout pre-commit

      - name: Lint Python with Ruff
        run: ruff check . --output-format=github

      - name: Check Ruff formatting
        run: ruff format --check .

      - name: Check notebooks have no outputs (nbstripout)
        run: |
          # Find all notebooks and verify they have no outputs
          python - <<'EOF'
          import json, pathlib, sys

          notebooks = list(pathlib.Path(".").rglob("*.ipynb"))
          failed = []

          for nb_path in notebooks:
              # Skip Jupyter checkpoints
              if ".ipynb_checkpoints" in str(nb_path):
                  continue
              data = json.loads(nb_path.read_text())
              for i, cell in enumerate(data.get("cells", [])):
                  if cell.get("cell_type") == "code":
                      if cell.get("outputs"):
                          failed.append(f"{nb_path} (cell {i+1} has outputs)")
                      if cell.get("execution_count") is not None:
                          failed.append(f"{nb_path} (cell {i+1} has execution count)")

          if failed:
              print("❌ The following notebooks contain outputs (run nbstripout to fix):")
              for f in failed:
                  print(f"  - {f}")
              sys.exit(1)
          else:
              print("✅ All notebooks are clean (no outputs committed)")
          EOF
